name: SAGE MATLAB R2025a validation
on:
  pull_request:
    paths:
      - 'SAGE/**'
      - '.github/workflows/sage-matlab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2025a
      - name: Run regression checks and known-channel experiments
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('SAGE','SAGE/validation'); run_sage_validation(fullfile(pwd,'sage-results'),20);
      - name: Upload logs, raw errors and figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sage-r2025a-results
          path: sage-results
          if-no-files-found: warn
